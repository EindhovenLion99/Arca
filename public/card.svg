<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="400"
    height="250"
    viewBox="0 0 400 250"
    fill="none">

    <!-- Tarjeta -->
    <rect
        x="10"
        y="10"
        width="380"
        height="230"
        rx="20"
        ry="20"
        fill="currentColor"
        stroke="currentColor"
        stroke-width="1.5" />

    <!-- Línea divisoria -->
    <line
        x1="10"
        y1="110"
        x2="390"
        y2="110"
        stroke="currentColor"
        stroke-width="1" />

    <!-- Círculos decorativos -->
    <circle
        cx="330"
        cy="205"
        r="18"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5" />

    <circle
        cx="350"
        cy="205"
        r="18"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5" />

</svg>